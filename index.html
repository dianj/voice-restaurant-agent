<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Restaurant Concierge</title>
<style>
    :root {
        --bg: #141210; --panel: #1d1a17; --panel-2: #26221e; --line: #3a342d;
        --text: #f3ede4; --muted: #a89f92; --accent: #e8a33d; --accent-ink: #1a1307;
        --ok: #5fb37a; --warn: #e8a33d; --bad: #e06c5a; --user: #3b4a3f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; }
    /* --fs is the visitor's text size (A- / A+); other sizes are derived from it. */
    .app { --fs: 16px; display: grid; grid-template-columns: minmax(380px, 1fr) minmax(420px, 1.1fr); height: 100vh; }

    /* --- Conversation --- */
    .chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    header .sub { color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
    .spacer { flex: 1; }
    .controls { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
    select, button { font: inherit; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .ghost:hover { border-color: var(--accent); }
    .ghost:disabled { opacity: .4; cursor: not-allowed; }
    .font-controls { display: inline-flex; align-items: center; gap: 4px; }
    .font-controls .ghost { padding: 3px 9px; font-weight: 700; }
    #fontSizeLabel { min-width: 38px; text-align: center; }
    /* Model picker: the status dot sits inside the dropdown; the status text is for screen readers and the tooltip. */
    .model-picker { position: relative; display: inline-flex; align-items: center; }
    .model-picker .dot { position: absolute; left: 10px; pointer-events: none; }
    .model-picker select { padding-left: 24px; font-size: 13px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    #speechLanguage { height: 52px; flex: none; }
    select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { font-size: var(--fs); max-width: 86%; padding: 12px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
    .msg.bot.error { border: 1px solid var(--bad); }
    /* "The agent is working" bubble, shown in the conversation until the reply arrives. */
    .msg.typing { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px;
                  display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .typing .dots { display: inline-flex; gap: 4px; }
    .typing .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
                         animation: bounce 1.2s infinite ease-in-out; }
    .typing .dots span:nth-child(2) { animation-delay: .15s; }
    .typing .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .typing .dots span { animation: none; opacity: .8; } }
    .msg .meta { display: block; font-size: calc(var(--fs) - 5px); color: var(--muted); margin-bottom: 4px; white-space: normal; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }
    .tool { font: calc(var(--fs) - 4px) ui-monospace, Consolas, monospace; color: var(--text); background: #120f0c; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; cursor: pointer; }
    .tool::before { content: "●"; margin-right: 5px; color: var(--ok); }
    .tool.unavailable::before { color: var(--warn); } .tool.error::before, .tool.system_error::before { color: var(--bad); }
    .tool-args { width: 100%; font: calc(var(--fs) - 4px) ui-monospace, Consolas, monospace; color: var(--muted); background: #120f0c; border-radius: 6px; padding: 6px 8px; display: none; white-space: pre-wrap; }
    .tool-args.open { display: block; }
    .actions { margin-top: 8px; white-space: normal; }
    .link { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; font-size: calc(var(--fs) - 4px); }
    .link:hover { color: var(--accent); }

    .examples { padding: 0 20px 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .example { background: var(--panel); color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 5px 11px; font-size: calc(var(--fs) - 4px); cursor: pointer; }
    .example:hover { color: var(--text); border-color: var(--accent); }

    .composer { border-top: 1px solid var(--line); padding: 14px 20px 18px; display: flex; gap: 10px; align-items: flex-end; }
    #mic { width: 52px; height: 52px; flex: none; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink); font-size: 22px; cursor: pointer; }
    #mic.recording { background: var(--bad); color: white; animation: pulse 1.2s infinite; }
    #mic:disabled, #send:disabled { opacity: .45; cursor: not-allowed; animation: none; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(224,108,90,.15); } }
    #input { flex: 1; resize: none; min-height: calc(var(--fs) * 3 + 28px); max-height: calc(var(--fs) * 7 + 28px); background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font: inherit; font-size: var(--fs); }
    #input:focus { outline: none; border-color: var(--accent); }
    #send { height: 52px; padding: 0 18px; border-radius: 12px; border: none; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); cursor: pointer; }
    #hint { padding: 0 20px 10px; font-size: 12px; color: var(--muted); min-height: 18px; }

    /* --- Staff view --- */
    .staff { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
    .staff header h2 { font-size: 16px; margin: 0; }
    .tablewrap { overflow: auto; flex: 1; padding: 0 20px 20px; }
    .table-title { font-size: 14px; margin: 26px 8px 4px; color: var(--muted); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: calc(var(--fs) - 3px); }
    th { text-align: left; color: var(--muted); font-weight: 600; padding: 12px 8px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.code { font-family: ui-monospace, Consolas, monospace; color: var(--accent); white-space: nowrap; }
    td small { color: var(--muted); display: block; }
    tr.fresh { animation: flash 2.5s ease-out; }
    @keyframes flash { from { background: rgba(232,163,61,.25); } to { background: transparent; } }
    .badge { font-size: calc(var(--fs) - 5px); padding: 2px 7px; border-radius: 999px; background: rgba(95,179,122,.15); color: var(--ok); }
    .badge.cancelled { background: rgba(224,108,90,.15); color: var(--bad); }
    .badge.changed { background: rgba(230,180,80,.15); color: var(--accent); margin-left: 4px; }
    tr.cancelled td:not(:last-child) { opacity: .5; text-decoration: line-through; }
    .empty { color: var(--muted); padding: 30px 8px; text-align: center; }
    @media (max-width: 900px) { .app { grid-template-columns: 1fr; height: auto; } .chat { height: 100vh; } }
</style>
</head>
<body>
<div class="app">
    <section class="chat" aria-label="Conversation">
        <header>
            <div>
                <h1>Restaurant Concierge</h1>
                <div class="sub">Speak or type in English, Bulgarian, German, Spanish, French or Italian</div>
            </div>
            <span class="spacer"></span>
            <div class="model-picker">
                <span class="dot" id="llmDot" aria-hidden="true"></span>
                <select id="modelSelect" aria-label="AI model" aria-describedby="llmStatus"><option>Loading…</option></select>
                <span class="sr-only" id="llmStatus" aria-live="polite">checking model…</span>
            </div>
        </header>
        <div class="controls" style="padding: 10px 20px; border-bottom: 1px solid var(--line);">
            <label><input type="checkbox" id="voiceReplies"> Voice replies</label>
            <select id="voiceGender" aria-label="Voice">
                <option value="female">Female voice</option>
                <option value="male">Male voice</option>
            </select>
            <span class="font-controls" role="group" aria-label="Text size">
                <span>Text</span>
                <button class="ghost" id="fontSmaller" type="button" title="Smaller text" aria-label="Smaller text">A−</button>
                <span id="fontSizeLabel" aria-live="polite">16px</span>
                <button class="ghost" id="fontLarger" type="button" title="Larger text" aria-label="Larger text">A+</button>
            </span>
            <span class="spacer"></span>
            <button class="ghost" id="newChat" type="button">New conversation</button>
        </div>

        <div id="messages" aria-live="polite"></div>

        <div class="examples" id="examples"></div>
        <div id="hint"></div>
        <div class="composer">
            <select id="speechLanguage" aria-label="Language you speak"
                    title="Language you speak. Auto-detect guesses it from the recording; pick yours if it guesses wrong.">
                <option value="auto">Auto-detect</option>
                <option value="bg">Български</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
            </select>
            <button id="mic" type="button" title="Record a voice message" aria-label="Record a voice message">🎤</button>
            <textarea id="input" rows="1" placeholder="e.g. A table for two tomorrow at 19:30, Italian in Sofia Center"></textarea>
            <button id="send" type="button">Send</button>
        </div>
    </section>

    <section class="staff" aria-label="Staff view">
        <header>
            <div>
                <h2>Staff view · Reservations</h2>
                <div class="sub">What the restaurant sees. Updates after every reply.</div>
            </div>
        </header>
        <div class="tablewrap">
            <table>
                <thead><tr><th>Code</th><th>Guest</th><th>Restaurant</th><th>When</th><th>Guests</th><th>Status</th></tr></thead>
                <tbody id="reservations"></tbody>
            </table>
            <h3 class="table-title">Callback requests</h3>
            <table>
                <thead><tr><th>#</th><th>Guest</th><th>Contact</th><th>Request</th><th>Received</th></tr></thead>
                <tbody id="requests"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const messages = $('messages'), input = $('input'), mic = $('mic'), send = $('send'), hint = $('hint');
const player = new Audio();
let busy = false, recorder = null, chunks = [], recordTimer = null;
let knownCodes = new Set();
const MAX_RECORD_MS = 30000;

const EXAMPLES = [
    'Find a highly rated Japanese restaurant in Sofia',
    'Маса за четирима утре в 20:00, българска кухня в Пловдив',
    'I am allergic to gluten. What can I eat there?',
    'Cancel my reservation, please',
];

// --- Rendering (DOM nodes and textContent only: model output is never parsed as HTML) ---
// Stored timestamps are UTC with an offset; staff read them in their own local time (YYYY-MM-DD HH:MM).
function localTime(stamp) {
    const when = new Date(stamp);
    return isNaN(when) ? String(stamp) : when.toLocaleString('sv-SE', {dateStyle: 'short', timeStyle: 'short'});
}

function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
}

function scrollDown() { messages.scrollTop = messages.scrollHeight; }

function addUser(text, language) {
    const box = el('div', 'msg user');
    if (language) box.append(el('span', 'meta', `🎤 voice · ${language.toUpperCase()}`));
    box.append(document.createTextNode(text));
    messages.append(box);
    scrollDown();
}

function addBot(text, { toolCalls = [], language = null, error = false } = {}) {
    const box = el('div', 'msg bot' + (error ? ' error' : ''));
    box.append(document.createTextNode(text));
    if (toolCalls.length) {
        const tools = el('div', 'tools');
        for (const call of toolCalls) {
            const chip = el('button', `tool ${call.status}`, call.name);
            chip.type = 'button';
            chip.title = 'Show arguments';
            const args = el('div', 'tool-args', `${call.name}(${prettyArgs(call.arguments)}) → ${call.status}`);
            chip.onclick = () => args.classList.toggle('open');
            tools.append(chip, args);
        }
        box.append(tools);
    }
    if (!error) {
        const actions = el('div', 'actions');
        const listen = el('button', 'link', '🔊 Read aloud');
        listen.type = 'button';
        listen.onclick = () => speak(text, language);
        actions.append(listen);
        box.append(actions);
    }
    messages.append(box);
    scrollDown();
}

function prettyArgs(raw) {
    try { return JSON.stringify(JSON.parse(raw)); } catch { return raw; }
}

function setBusy(state, label = '') {
    busy = state;
    send.disabled = state;
    mic.disabled = state && !recorder;
    // No model switch in the middle of a turn: LM Studio would unload the model that is answering.
    $('modelSelect').disabled = state;
    hint.textContent = label;
}

// --- Chat ---
function showTyping(label) {
    const box = el('div', 'msg typing');
    box.setAttribute('role', 'status');
    const dots = el('span', 'dots');
    dots.setAttribute('aria-hidden', 'true');
    dots.append(el('span'), el('span'), el('span'));
    const text = el('span', 'typing-label', label);
    box.append(dots, text);
    messages.append(box);
    scrollDown();
    const started = Date.now();
    const tick = setInterval(() => { text.textContent = `${label} ${Math.round((Date.now() - started) / 1000)} s`; }, 1000);
    return () => { clearInterval(tick); box.remove(); };
}

async function postChat(form, pendingLabel) {
    setBusy(true);
    const hideTyping = showTyping(pendingLabel);
    try {
        const res = await fetch('/api/chat', { method: 'POST', body: form });
        let data;
        try { data = await res.json(); } catch { data = { error: `Server error (${res.status}).` }; }
        hideTyping();
        if (data.error) { addBot(data.error, { error: true }); return; }
        if (data.spoken_language !== undefined && form.has('audio')) {
            if (data.user_text) addUser(data.user_text, data.spoken_language);
        }
        addBot(data.reply, { toolCalls: data.tool_calls || [], language: data.reply_language, error: !!data.system_error });
        if ($('voiceReplies').checked && !data.system_error) speak(data.reply, data.reply_language);
        loadReservations();
    } catch {
        hideTyping();
        addBot('Cannot reach the server. Is it running?', { error: true });
    } finally {
        hideTyping();
        setBusy(false);
    }
}

function sendText(text) {
    text = (text ?? input.value).trim();
    if (!text || busy) return;
    input.value = '';
    addUser(text);
    const form = new FormData();
    form.append('message', text);
    postChat(form, 'The agent is thinking…');
}

send.onclick = () => sendText();
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});

// --- Voice input ---
mic.onclick = async () => {
    if (recorder) { recorder.stop(); return; }
    if (busy) return;
    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
        hint.textContent = 'Microphone access was blocked. Allow it in the browser, or type instead.';
        return;
    }
    player.pause();
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
        clearTimeout(recordTimer);
        stream.getTracks().forEach((t) => t.stop());   // release the microphone
        const type = recorder.mimeType || 'audio/webm';
        recorder = null;
        mic.classList.remove('recording');
        const blob = new Blob(chunks, { type });
        if (blob.size < 1000) { setBusy(false, 'Recording was too short.'); return; }
        const form = new FormData();
        form.append('audio', blob, type.includes('ogg') ? 'speech.ogg' : 'speech.webm');
        form.append('language', $('speechLanguage').value);   // 'auto' = let Whisper detect it
        postChat(form, 'Transcribing and thinking…');
    };
    recorder.start();
    mic.classList.add('recording');
    setBusy(true, 'Recording… click the microphone again to send.');
    mic.disabled = false;
    recordTimer = setTimeout(() => recorder && recorder.stop(), MAX_RECORD_MS);
};

// --- Voice output ---
async function speak(text, language) {
    player.pause();
    const form = new FormData();
    form.append('text', text);
    if (language) form.append('language', language);
    form.append('gender', $('voiceGender').value);
    try {
        const res = await fetch('/api/tts', { method: 'POST', body: form });
        if (!res.ok) { hint.textContent = 'Voice reply is not available right now.'; return; }
        player.src = URL.createObjectURL(await res.blob());
        await player.play();
    } catch {
        hint.textContent = 'Voice reply could not be played.';
    }
}

// --- Staff view ---
async function loadReservations() {
    let data;
    try { data = await (await fetch('/api/reservations')).json(); } catch { return; }
    renderRequests(data.requests || []);
    const body = $('reservations');
    body.replaceChildren();
    if (!data.reservations.length) {
        const row = el('tr'); const cell = el('td', 'empty', 'No reservations yet. Book a table in the chat.');
        cell.colSpan = 6; row.append(cell); body.append(row);
        knownCodes = new Set(['']);   // marks "loaded once", so the first booking is highlighted
        return;
    }
    for (const r of data.reservations) {
        const row = el('tr', r.status === 'cancelled' ? 'cancelled' : '');
        if (knownCodes.size && !knownCodes.has(r.code)) row.classList.add('fresh');
        const guest = el('td', '', r.customer_name);
        if (r.extra_names.length) guest.append(el('small', '', 'also: ' + r.extra_names.join(', ')));
        if (r.notes) guest.append(el('small', '', r.notes));
        const place = el('td', '', r.restaurant);
        place.append(el('small', '', `${r.area}, ${r.city}`));
        const status = el('td');
        status.append(el('span', 'badge ' + r.status, r.status));
        if (r.history.length) {
            const changed = el('span', 'badge changed', 'changed');
            changed.title = r.history.map((h) => `${localTime(h.at)}  ${h.change}`).join('\n');
            status.append(changed);
            for (const h of r.history) status.append(el('small', '', h.change.replace(' -> ', ' → ')));
        }
        row.append(el('td', 'code', r.code), guest, place, el('td', '', `${r.date} ${r.time}`), el('td', '', String(r.guests)), status);
        body.append(row);
    }
    knownCodes = new Set(data.reservations.map((r) => r.code));
}

const KIND_LABELS = { event: 'Event', large_group: 'Large group', other: 'Other' };
let knownRequests = null;

function renderRequests(requests) {
    const body = $('requests');
    body.replaceChildren();
    if (!requests.length) {
        const row = el('tr'); const cell = el('td', 'empty', 'No callback requests.');
        cell.colSpan = 5; row.append(cell); body.append(row);
    }
    for (const q of requests) {
        const row = el('tr');
        if (knownRequests && !knownRequests.has(q.id)) row.classList.add('fresh');
        const what = el('td', '', q.details);
        const facts = [KIND_LABELS[q.kind] || q.kind, q.guests ? `${q.guests} people` : '', q.date || '', q.city || '']
            .filter(Boolean).join(' · ');
        what.append(el('small', '', facts));
        row.append(el('td', 'code', String(q.id)), el('td', '', q.customer_name), el('td', '', q.contact), what,
                   el('td', '', localTime(q.created_at)));
        body.append(row);
    }
    knownRequests = new Set(requests.map((q) => q.id));
}

// --- Setup ---
for (const text of EXAMPLES) {
    const chip = el('button', 'example', text);
    chip.type = 'button';
    chip.onclick = () => sendText(text);
    $('examples').append(chip);
}

$('newChat').onclick = async () => {
    await fetch('/api/reset', { method: 'POST' });
    messages.replaceChildren();
    greet();
};

for (const key of ['voiceReplies', 'voiceGender', 'speechLanguage']) {
    const node = $(key);
    const saved = localStorage.getItem(key);
    if (saved !== null) node.type === 'checkbox' ? (node.checked = saved === 'true') : (node.value = saved);
    node.onchange = () => localStorage.setItem(key, node.type === 'checkbox' ? node.checked : node.value);
}

function greet() {
    addBot('Hello! I can find a restaurant, check the menu and allergens, and book, change or cancel a table. How can I help?');
}

// --- Text size (A− / A+), remembered per browser ---
const FONT_MIN = 12, FONT_MAX = 24, FONT_STEP = 2, FONT_DEFAULT = 16;

function applyFont(size) {
    size = Math.min(FONT_MAX, Math.max(FONT_MIN, size));
    document.querySelector('.app').style.setProperty('--fs', `${size}px`);
    $('fontSizeLabel').textContent = `${size}px`;
    $('fontSmaller').disabled = size <= FONT_MIN;
    $('fontLarger').disabled = size >= FONT_MAX;
    localStorage.setItem('fontSize', String(size));
}

const currentFont = () => Number(localStorage.getItem('fontSize')) || FONT_DEFAULT;
$('fontSmaller').onclick = () => applyFont(currentFont() - FONT_STEP);
$('fontLarger').onclick = () => applyFont(currentFont() + FONT_STEP);
applyFont(currentFont());

// --- Model status and selection (one model at a time in LM Studio) ---
let models = [], switchPoll = null;
const modelLabel = (id) => (models.find((m) => m.id === id) || {}).label || id;

// The colour of the dot shows the status; the same text goes to screen readers and the tooltip.
function setStatus(ok, text) {
    $('llmDot').className = 'dot ' + (ok ? 'ok' : 'bad');
    $('llmStatus').textContent = text;
    $('modelSelect').title = `AI model: ${text}`;
}

async function checkHealth() {
    try {
        const data = await (await fetch('/api/health')).json();
        const ok = data.llm.reachable && data.llm.model_available && !data.switching;
        setStatus(ok, data.switching ? 'loading model…'
            : ok ? 'ready' : (data.llm.reachable ? 'model not loaded' : 'LM Studio not reachable'));
    } catch {
        setStatus(false, 'server not reachable');
    }
}

async function loadModels() {
    const select = $('modelSelect');
    try {
        const data = await (await fetch('/api/models')).json();
        models = data.models;
        select.replaceChildren();
        for (const m of models) {
            const option = new Option(m.label, m.id);
            if (m.installed === false) { option.textContent += ' (not installed)'; option.disabled = true; }
            select.append(option);
        }
        select.value = data.switching && data.target ? data.target : data.active;
        select.disabled = data.switching;
        // A switch started elsewhere (another tab, server start): poll until it finishes.
        if (data.switching && !switchPoll) {
            switchPoll = setInterval(async () => {
                const state = await (await fetch('/api/models')).json();
                if (!state.switching) { clearInterval(switchPoll); switchPoll = null; loadModels(); }
            }, 3000);
        }
    } catch {
        select.replaceChildren(new Option('LM Studio not reachable'));
    }
    checkHealth();
}

$('modelSelect').onchange = async (event) => {
    const target = event.target.value;
    event.target.disabled = true;
    setBusy(true, `Switching to ${modelLabel(target)}: unloading the current model and loading the new one…`);
    setStatus(false, 'loading model…');
    let data;
    try {
        const form = new FormData();
        form.append('model', target);
        data = await (await fetch('/api/model', { method: 'POST', body: form })).json();
    } catch {
        data = { status: 'error', message: 'The server did not answer.' };
    }
    setBusy(false);
    if (data.status === 'success') addBot(`The assistant now uses ${modelLabel(target)}.`);
    else addBot(`Could not switch the model: ${data.message}`, { error: true });
    loadModels();
};

greet();
loadReservations();
loadModels();
</script>
</body>
</html>
