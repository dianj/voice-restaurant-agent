<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Restaurant Concierge</title>
<style>
    :root {
        --bg: #141210; --panel: #1d1a17; --panel-2: #26221e; --line: #3a342d;
        --text: #f3ede4; --muted: #a89f92; --accent: #e8a33d; --accent-ink: #1a1307;
        --ok: #5fb37a; --warn: #e8a33d; --bad: #e06c5a; --user: #3b4a3f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; }
    .app { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(420px, 1.1fr); height: 100vh; }

    /* --- Conversation --- */
    .chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    header .sub { color: var(--muted); font-size: 12px; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
    .spacer { flex: 1; }
    .controls { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
    select, button { font: inherit; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .ghost:hover { border-color: var(--accent); }
    select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 86%; padding: 12px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
    .msg.bot.error { border: 1px solid var(--bad); }
    .msg .meta { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; white-space: normal; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }
    .tool { font: 12px ui-monospace, Consolas, monospace; color: var(--text); background: #120f0c; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; cursor: pointer; }
    .tool::before { content: "●"; margin-right: 5px; color: var(--ok); }
    .tool.unavailable::before { color: var(--warn); } .tool.error::before, .tool.system_error::before { color: var(--bad); }
    .tool-args { width: 100%; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); background: #120f0c; border-radius: 6px; padding: 6px 8px; display: none; white-space: pre-wrap; }
    .tool-args.open { display: block; }
    .actions { margin-top: 8px; white-space: normal; }
    .link { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 12px; }
    .link:hover { color: var(--accent); }

    .examples { padding: 0 20px 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .example { background: var(--panel); color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
    .example:hover { color: var(--text); border-color: var(--accent); }

    .composer { border-top: 1px solid var(--line); padding: 14px 20px 18px; display: flex; gap: 10px; align-items: flex-end; }
    #mic { width: 52px; height: 52px; flex: none; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink); font-size: 22px; cursor: pointer; }
    #mic.recording { background: var(--bad); color: white; animation: pulse 1.2s infinite; }
    #mic:disabled, #send:disabled { opacity: .45; cursor: not-allowed; animation: none; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(224,108,90,.15); } }
    #input { flex: 1; resize: none; min-height: 52px; max-height: 140px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font: inherit; }
    #input:focus { outline: none; border-color: var(--accent); }
    #send { height: 52px; padding: 0 18px; border-radius: 12px; border: none; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); cursor: pointer; }
    #hint { padding: 0 20px 10px; font-size: 12px; color: var(--muted); min-height: 18px; }

    /* --- Staff view --- */
    .staff { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
    .staff header h2 { font-size: 16px; margin: 0; }
    .tablewrap { overflow: auto; flex: 1; padding: 0 20px 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 600; padding: 12px 8px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.code { font-family: ui-monospace, Consolas, monospace; color: var(--accent); white-space: nowrap; }
    td small { color: var(--muted); display: block; }
    tr.fresh { animation: flash 2.5s ease-out; }
    @keyframes flash { from { background: rgba(232,163,61,.25); } to { background: transparent; } }
    .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(95,179,122,.15); color: var(--ok); }
    .badge.cancelled { background: rgba(224,108,90,.15); color: var(--bad); }
    tr.cancelled td:not(:last-child) { opacity: .5; text-decoration: line-through; }
    .empty { color: var(--muted); padding: 30px 8px; text-align: center; }
    @media (max-width: 900px) { .app { grid-template-columns: 1fr; height: auto; } .chat { height: 100vh; } }
</style>
</head>
<body>
<div class="app">
    <section class="chat" aria-label="Conversation">
        <header>
            <div>
                <h1>Restaurant Concierge</h1>
                <div class="sub">Speak or type in English, Bulgarian, German, Spanish, French or Italian</div>
            </div>
            <span class="spacer"></span>
            <span class="status" id="llmStatus"><span class="dot"></span><span>checking model…</span></span>
        </header>
        <div class="controls" style="padding: 10px 20px; border-bottom: 1px solid var(--line);">
            <label><input type="checkbox" id="voiceReplies"> Voice replies</label>
            <select id="voiceGender" aria-label="Voice">
                <option value="female">Female voice</option>
                <option value="male">Male voice</option>
            </select>
            <span class="spacer"></span>
            <button class="ghost" id="newChat" type="button">New conversation</button>
        </div>

        <div id="messages" aria-live="polite"></div>

        <div class="examples" id="examples"></div>
        <div id="hint"></div>
        <div class="composer">
            <button id="mic" type="button" title="Record a voice message" aria-label="Record a voice message">🎤</button>
            <textarea id="input" rows="1" placeholder="e.g. A table for two tomorrow at 19:30, Italian in Sofia Center"></textarea>
            <button id="send" type="button">Send</button>
        </div>
    </section>

    <section class="staff" aria-label="Staff view">
        <header>
            <div>
                <h2>Staff view · Reservations</h2>
                <div class="sub">What the restaurant sees. Updates after every reply.</div>
            </div>
        </header>
        <div class="tablewrap">
            <table>
                <thead><tr><th>Code</th><th>Guest</th><th>Restaurant</th><th>When</th><th>Guests</th><th>Status</th></tr></thead>
                <tbody id="reservations"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const messages = $('messages'), input = $('input'), mic = $('mic'), send = $('send'), hint = $('hint');
const player = new Audio();
let busy = false, recorder = null, chunks = [], recordTimer = null;
let knownCodes = new Set();
const MAX_RECORD_MS = 30000;

const EXAMPLES = [
    'Find a highly rated Japanese restaurant in Sofia',
    'Маса за четирима утре в 20:00, българска кухня в Пловдив',
    'I am allergic to gluten. What can I eat there?',
    'Cancel my reservation, please',
];

// --- Rendering (DOM nodes and textContent only: model output is never parsed as HTML) ---
function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
}

function scrollDown() { messages.scrollTop = messages.scrollHeight; }

function addUser(text, language) {
    const box = el('div', 'msg user');
    if (language) box.append(el('span', 'meta', `🎤 voice · ${language.toUpperCase()}`));
    box.append(document.createTextNode(text));
    messages.append(box);
    scrollDown();
}

function addBot(text, { toolCalls = [], language = null, error = false } = {}) {
    const box = el('div', 'msg bot' + (error ? ' error' : ''));
    box.append(document.createTextNode(text));
    if (toolCalls.length) {
        const tools = el('div', 'tools');
        for (const call of toolCalls) {
            const chip = el('button', `tool ${call.status}`, call.name);
            chip.type = 'button';
            chip.title = 'Show arguments';
            const args = el('div', 'tool-args', `${call.name}(${prettyArgs(call.arguments)}) → ${call.status}`);
            chip.onclick = () => args.classList.toggle('open');
            tools.append(chip, args);
        }
        box.append(tools);
    }
    if (!error) {
        const actions = el('div', 'actions');
        const listen = el('button', 'link', '🔊 Read aloud');
        listen.type = 'button';
        listen.onclick = () => speak(text, language);
        actions.append(listen);
        box.append(actions);
    }
    messages.append(box);
    scrollDown();
}

function prettyArgs(raw) {
    try { return JSON.stringify(JSON.parse(raw)); } catch { return raw; }
}

function setBusy(state, label = '') {
    busy = state;
    send.disabled = state;
    mic.disabled = state && !recorder;
    hint.textContent = label;
}

// --- Chat ---
async function postChat(form, pendingLabel) {
    setBusy(true, pendingLabel);
    const started = Date.now();
    const tick = setInterval(() => { hint.textContent = `${pendingLabel} ${Math.round((Date.now() - started) / 1000)} s`; }, 1000);
    try {
        const res = await fetch('/api/chat', { method: 'POST', body: form });
        let data;
        try { data = await res.json(); } catch { data = { error: `Server error (${res.status}).` }; }
        if (data.error) { addBot(data.error, { error: true }); return; }
        if (data.spoken_language !== undefined && form.has('audio')) {
            if (data.user_text) addUser(data.user_text, data.spoken_language);
        }
        addBot(data.reply, { toolCalls: data.tool_calls || [], language: data.reply_language, error: !!data.system_error });
        if ($('voiceReplies').checked && !data.system_error) speak(data.reply, data.reply_language);
        loadReservations();
    } catch {
        addBot('Cannot reach the server. Is it running?', { error: true });
    } finally {
        clearInterval(tick);
        setBusy(false);
    }
}

function sendText(text) {
    text = (text ?? input.value).trim();
    if (!text || busy) return;
    input.value = '';
    addUser(text);
    const form = new FormData();
    form.append('message', text);
    postChat(form, 'Thinking…');
}

send.onclick = () => sendText();
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});

// --- Voice input ---
mic.onclick = async () => {
    if (recorder) { recorder.stop(); return; }
    if (busy) return;
    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
        hint.textContent = 'Microphone access was blocked. Allow it in the browser, or type instead.';
        return;
    }
    player.pause();
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
        clearTimeout(recordTimer);
        stream.getTracks().forEach((t) => t.stop());   // release the microphone
        const type = recorder.mimeType || 'audio/webm';
        recorder = null;
        mic.classList.remove('recording');
        const blob = new Blob(chunks, { type });
        if (blob.size < 1000) { setBusy(false, 'Recording was too short.'); return; }
        const form = new FormData();
        form.append('audio', blob, type.includes('ogg') ? 'speech.ogg' : 'speech.webm');
        postChat(form, 'Listening and thinking…');
    };
    recorder.start();
    mic.classList.add('recording');
    setBusy(true, 'Recording… click the microphone again to send.');
    mic.disabled = false;
    recordTimer = setTimeout(() => recorder && recorder.stop(), MAX_RECORD_MS);
};

// --- Voice output ---
async function speak(text, language) {
    player.pause();
    const form = new FormData();
    form.append('text', text);
    if (language) form.append('language', language);
    form.append('gender', $('voiceGender').value);
    try {
        const res = await fetch('/api/tts', { method: 'POST', body: form });
        if (!res.ok) { hint.textContent = 'Voice reply is not available right now.'; return; }
        player.src = URL.createObjectURL(await res.blob());
        await player.play();
    } catch {
        hint.textContent = 'Voice reply could not be played.';
    }
}

// --- Staff view ---
async function loadReservations() {
    let data;
    try { data = await (await fetch('/api/reservations')).json(); } catch { return; }
    const body = $('reservations');
    body.replaceChildren();
    if (!data.reservations.length) {
        const row = el('tr'); const cell = el('td', 'empty', 'No reservations yet. Book a table in the chat.');
        cell.colSpan = 6; row.append(cell); body.append(row);
        knownCodes = new Set(['']);   // marks "loaded once", so the first booking is highlighted
        return;
    }
    for (const r of data.reservations) {
        const row = el('tr', r.status === 'cancelled' ? 'cancelled' : '');
        if (knownCodes.size && !knownCodes.has(r.code)) row.classList.add('fresh');
        const guest = el('td', '', r.customer_name);
        if (r.notes) guest.append(el('small', '', r.notes));
        const place = el('td', '', r.restaurant);
        place.append(el('small', '', `${r.area}, ${r.city}`));
        const status = el('td');
        status.append(el('span', 'badge ' + r.status, r.status));
        row.append(el('td', 'code', r.code), guest, place, el('td', '', `${r.date} ${r.time}`), el('td', '', String(r.guests)), status);
        body.append(row);
    }
    knownCodes = new Set(data.reservations.map((r) => r.code));
}

// --- Setup ---
for (const text of EXAMPLES) {
    const chip = el('button', 'example', text);
    chip.type = 'button';
    chip.onclick = () => sendText(text);
    $('examples').append(chip);
}

$('newChat').onclick = async () => {
    await fetch('/api/reset', { method: 'POST' });
    messages.replaceChildren();
    greet();
};

for (const key of ['voiceReplies', 'voiceGender']) {
    const node = $(key);
    const saved = localStorage.getItem(key);
    if (saved !== null) node.type === 'checkbox' ? (node.checked = saved === 'true') : (node.value = saved);
    node.onchange = () => localStorage.setItem(key, node.type === 'checkbox' ? node.checked : node.value);
}

function greet() {
    addBot('Hello! I can find a restaurant, check the menu and allergens, and book or cancel a table. How can I help?');
}

async function checkHealth() {
    const box = $('llmStatus');
    try {
        const data = await (await fetch('/api/health')).json();
        const ok = data.llm.reachable && data.llm.model_available;
        box.firstElementChild.className = 'dot ' + (ok ? 'ok' : 'bad');
        box.lastElementChild.textContent = ok ? data.model : (data.llm.reachable ? `${data.model} not loaded` : 'LM Studio not reachable');
    } catch {
        box.firstElementChild.className = 'dot bad';
        box.lastElementChild.textContent = 'server not reachable';
    }
}

greet();
loadReservations();
checkHealth();
</script>
</body>
</html>
