<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 1026" width="1410" height="1026" role="img" aria-label="Sequence diagram of one chat turn of the voice restaurant concierge">
<title>One chat turn: voice or text in, tool-calling loop over the booking rules, reply and optional voice out</title>
<style>
  svg { background: #141210; }
  text { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #f3ede4; }
  .actor { fill: #26221e; stroke: #e8a33d; stroke-width: 1.5; }
  .actor-text { font-size: 13px; font-weight: 600; }
  .lifeline { stroke: #6b6258; stroke-width: 1; stroke-dasharray: 6 4; }
  .edge { stroke: #d8cfc2; stroke-width: 1.5; }
  .dashed { stroke-dasharray: 5 4; }
  .pill { fill: #1d1a17; stroke: #3a342d; }
  .edge-label { font-size: 11px; fill: #d8cfc2; }
  .note { fill: #2b2419; stroke: #e8a33d; stroke-width: 1; stroke-dasharray: 3 3; }
  .note-text { fill: #f3ede4; }
  .block { fill: none; stroke: #8a7f72; stroke-width: 1.2; }
  .badge { fill: #3a342d; stroke: #8a7f72; }
  .badge-text { font-size: 11px; font-weight: 700; }
  .guard { font-size: 11px; fill: #e8a33d; }
</style>
<defs><marker id="arrow" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#d8cfc2"/></marker></defs>
<line x1="120" y1="74" x2="120" y2="962" class="lifeline"/>
<rect x="25.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="120" y="56.5" text-anchor="middle" class="actor-text">Guest (browser)</text>
<rect x="25.0" y="962" width="190" height="44" rx="6" class="actor"/>
<text x="120" y="988.5" text-anchor="middle" class="actor-text">Guest (browser)</text>
<line x1="350" y1="74" x2="350" y2="962" class="lifeline"/>
<rect x="255.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="350" y="56.5" text-anchor="middle" class="actor-text">FastAPI server</text>
<rect x="255.0" y="962" width="190" height="44" rx="6" class="actor"/>
<text x="350" y="988.5" text-anchor="middle" class="actor-text">FastAPI server</text>
<line x1="580" y1="74" x2="580" y2="962" class="lifeline"/>
<rect x="485.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="580" y="56.5" text-anchor="middle" class="actor-text">faster-whisper (local STT)</text>
<rect x="485.0" y="962" width="190" height="44" rx="6" class="actor"/>
<text x="580" y="988.5" text-anchor="middle" class="actor-text">faster-whisper (local STT)</text>
<line x1="810" y1="74" x2="810" y2="962" class="lifeline"/>
<rect x="715.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="810" y="56.5" text-anchor="middle" class="actor-text">Gemma / Qwen (LM Studio)</text>
<rect x="715.0" y="962" width="190" height="44" rx="6" class="actor"/>
<text x="810" y="988.5" text-anchor="middle" class="actor-text">Gemma / Qwen (LM Studio)</text>
<line x1="1040" y1="74" x2="1040" y2="962" class="lifeline"/>
<rect x="945.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="1040" y="56.5" text-anchor="middle" class="actor-text">Tools + SQLite</text>
<rect x="945.0" y="962" width="190" height="44" rx="6" class="actor"/>
<text x="1040" y="988.5" text-anchor="middle" class="actor-text">Tools + SQLite</text>
<line x1="1270" y1="74" x2="1270" y2="962" class="lifeline"/>
<rect x="1175.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="1270" y="56.5" text-anchor="middle" class="actor-text">edge-tts (online)</text>
<rect x="1175.0" y="962" width="190" height="44" rx="6" class="actor"/>
<text x="1270" y="988.5" text-anchor="middle" class="actor-text">edge-tts (online)</text>
<line x1="120" y1="114" x2="348" y2="114" class="edge" marker-end="url(#arrow)"/>
<rect x="86.7" y="93" width="296.6" height="17" rx="8" class="pill"/>
<text x="235.0" y="101.5" class="edge-label" text-anchor="middle">POST /api/chat  (typed text or recorded audio)</text>
<line x1="350" y1="186" x2="578" y2="186" class="edge" marker-end="url(#arrow)"/>
<rect x="286.2" y="165" width="357.6" height="17" rx="8" class="pill"/>
<text x="465.0" y="173.5" class="edge-label" text-anchor="middle">transcribe; language picked among EN, BG, DE, ES, FR, IT</text>
<line x1="580" y1="232" x2="352" y2="232" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="411.2" y="211" width="107.5" height="17" rx="8" class="pill"/>
<text x="465.0" y="219.5" class="edge-label" text-anchor="middle">text + language</text>
<rect x="364" y="256" width="477.5" height="24" rx="4" class="note"/>
<text x="374" y="268" class="edge-label note-text">empty transcript → 'Sorry, could you repeat?' in that language, no LLM call</text>
<rect x="25" y="130" width="1360" height="164" class="block"/>
<path d="M 25 130 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="33" y="141" class="badge-text">opt</text>
<text x="87" y="141" class="guard">[audio]</text>
<line x1="350" y1="368" x2="808" y2="368" class="edge" marker-end="url(#arrow)"/>
<rect x="358.5" y="347" width="443.0" height="17" rx="8" class="pill"/>
<text x="580.0" y="355.5" class="edge-label" text-anchor="middle">system prompt (today's date, booking rules) + history + 8 tool schemas</text>
<line x1="810" y1="414" x2="352" y2="414" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="450.0" y="393" width="260.0" height="17" rx="8" class="pill"/>
<text x="580.0" y="401.5" class="edge-label" text-anchor="middle">tool calls, e.g. check_availability(...)</text>
<line x1="350" y1="460" x2="1038" y2="460" class="edge" marker-end="url(#arrow)"/>
<rect x="427.8" y="439" width="534.5" height="17" rx="8" class="pill"/>
<text x="695.0" y="447.5" class="edge-label" text-anchor="middle">validate + run: opening hours, past dates, 2-hour sittings, capacity, BEGIN IMMEDIATE</text>
<line x1="1040" y1="506" x2="352" y2="506" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="491.8" y="485" width="406.4" height="17" rx="8" class="pill"/>
<text x="695.0" y="493.5" class="edge-label" text-anchor="middle">JSON: success | unavailable + alternatives | error (what to fix)</text>
<rect x="25" y="312" width="1360" height="218" class="block"/>
<path d="M 25 312 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="33" y="323" class="badge-text">loop</text>
<text x="87" y="323" class="guard">[up to 6 tool rounds (on a copy of the session history)]</text>
<line x1="810" y1="578" x2="352" y2="578" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="349.4" y="557" width="461.3" height="17" rx="8" class="pill"/>
<text x="580.0" y="565.5" class="edge-label" text-anchor="middle">final reply in the guest's language (books only after the guest confirms)</text>
<line x1="350" y1="624" x2="122" y2="624" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="44.0" y="603" width="382.0" height="17" rx="8" class="pill"/>
<text x="235.0" y="611.5" class="edge-label" text-anchor="middle">reply + tool calls; history saved only if the turn succeeded</text>
<line x1="120" y1="670" x2="348" y2="670" class="edge" marker-end="url(#arrow)"/>
<rect x="95.8" y="649" width="278.3" height="17" rx="8" class="pill"/>
<text x="235.0" y="657.5" class="edge-label" text-anchor="middle">GET /api/reservations  (staff view: bookings + callback requests)</text>
<line x1="120" y1="742" x2="348" y2="742" class="edge" marker-end="url(#arrow)"/>
<rect x="111.1" y="721" width="247.8" height="17" rx="8" class="pill"/>
<text x="235.0" y="729.5" class="edge-label" text-anchor="middle">POST /api/tts (reply, language, voice)</text>
<line x1="350" y1="788" x2="1268" y2="788" class="edge" marker-end="url(#arrow)"/>
<rect x="597.6" y="767" width="424.7" height="17" rx="8" class="pill"/>
<text x="810.0" y="775.5" class="edge-label" text-anchor="middle">text with reservation codes spelled out (R34LST → R, 3, 4, L, S, T)</text>
<line x1="1270" y1="834" x2="352" y2="834" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="695.2" y="813" width="229.5" height="17" rx="8" class="pill"/>
<text x="810.0" y="821.5" class="edge-label" text-anchor="middle">MP3 (3 attempts, 15 s timeout each)</text>
<line x1="350" y1="880" x2="122" y2="880" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="196.5" y="859" width="77.0" height="17" rx="8" class="pill"/>
<text x="235.0" y="867.5" class="edge-label" text-anchor="middle">audio/mpeg</text>
<rect x="25" y="686" width="1360" height="218" class="block"/>
<path d="M 25 686 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="33" y="697" class="badge-text">opt</text>
<text x="87" y="697" class="guard">[voice replies on]</text>
</svg>
