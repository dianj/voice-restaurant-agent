<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 1176" width="1410" height="1176" role="img" aria-label="Sequence diagram of one chat turn of the voice restaurant concierge">
<title>One chat turn: voice or text in, tool-calling loop over the booking rules and a calibrated booking gate, reply and optional voice out</title>
<style>
  svg { background: #141210; }
  text { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #f3ede4; }
  .actor { fill: #26221e; stroke: #e8a33d; stroke-width: 1.5; }
  .actor-text { font-size: 13px; font-weight: 600; }
  .lifeline { stroke: #6b6258; stroke-width: 1; stroke-dasharray: 6 4; }
  .edge { stroke: #d8cfc2; stroke-width: 1.5; }
  .dashed { stroke-dasharray: 5 4; }
  .pill { fill: #1d1a17; stroke: #3a342d; }
  .edge-label { font-size: 11px; fill: #d8cfc2; }
  .note { fill: #2b2419; stroke: #e8a33d; stroke-width: 1; stroke-dasharray: 3 3; }
  .note-text { fill: #f3ede4; }
  .block { fill: none; stroke: #8a7f72; stroke-width: 1.2; }
  .badge { fill: #3a342d; stroke: #8a7f72; }
  .badge-text { font-size: 11px; font-weight: 700; }
  .guard { font-size: 11px; fill: #e8a33d; }
</style>
<defs><marker id="arrow" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#d8cfc2"/></marker></defs>
<line x1="120" y1="74" x2="120" y2="1112" class="lifeline"/>
<rect x="25.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="120" y="56.5" text-anchor="middle" class="actor-text">Guest (browser)</text>
<rect x="25.0" y="1112" width="190" height="44" rx="6" class="actor"/>
<text x="120" y="1138.5" text-anchor="middle" class="actor-text">Guest (browser)</text>
<line x1="350" y1="74" x2="350" y2="1112" class="lifeline"/>
<rect x="255.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="350" y="56.5" text-anchor="middle" class="actor-text">FastAPI server</text>
<rect x="255.0" y="1112" width="190" height="44" rx="6" class="actor"/>
<text x="350" y="1138.5" text-anchor="middle" class="actor-text">FastAPI server</text>
<line x1="580" y1="74" x2="580" y2="1112" class="lifeline"/>
<rect x="485.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="580" y="56.5" text-anchor="middle" class="actor-text">faster-whisper (local STT)</text>
<rect x="485.0" y="1112" width="190" height="44" rx="6" class="actor"/>
<text x="580" y="1138.5" text-anchor="middle" class="actor-text">faster-whisper (local STT)</text>
<line x1="810" y1="74" x2="810" y2="1112" class="lifeline"/>
<rect x="715.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="810" y="56.5" text-anchor="middle" class="actor-text">Gemma / Qwen (LM Studio)</text>
<rect x="715.0" y="1112" width="190" height="44" rx="6" class="actor"/>
<text x="810" y="1138.5" text-anchor="middle" class="actor-text">Gemma / Qwen (LM Studio)</text>
<line x1="1040" y1="74" x2="1040" y2="1112" class="lifeline"/>
<rect x="945.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="1040" y="56.5" text-anchor="middle" class="actor-text">Tools + SQLite</text>
<rect x="945.0" y="1112" width="190" height="44" rx="6" class="actor"/>
<text x="1040" y="1138.5" text-anchor="middle" class="actor-text">Tools + SQLite</text>
<line x1="1270" y1="74" x2="1270" y2="1112" class="lifeline"/>
<rect x="1175.0" y="30" width="190" height="44" rx="6" class="actor"/>
<text x="1270" y="56.5" text-anchor="middle" class="actor-text">edge-tts (online)</text>
<rect x="1175.0" y="1112" width="190" height="44" rx="6" class="actor"/>
<text x="1270" y="1138.5" text-anchor="middle" class="actor-text">edge-tts (online)</text>
<line x1="120" y1="114" x2="348" y2="114" class="edge" marker-end="url(#arrow)"/>
<rect x="86.7" y="93" width="296.6" height="17" rx="8" class="pill"/>
<text x="235.0" y="101.5" class="edge-label" text-anchor="middle">POST /api/chat  (typed text or recorded audio)</text>
<line x1="350" y1="186" x2="578" y2="186" class="edge" marker-end="url(#arrow)"/>
<rect x="286.2" y="165" width="357.6" height="17" rx="8" class="pill"/>
<text x="465.0" y="173.5" class="edge-label" text-anchor="middle">transcribe; language picked among EN, BG, DE, ES, FR, IT</text>
<line x1="580" y1="232" x2="352" y2="232" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="411.2" y="211" width="107.5" height="17" rx="8" class="pill"/>
<text x="465.0" y="219.5" class="edge-label" text-anchor="middle">text + language</text>
<rect x="364" y="256" width="477.5" height="24" rx="4" class="note"/>
<text x="374" y="268" class="edge-label note-text">empty transcript → 'Sorry, could you repeat?' in that language, no LLM call</text>
<rect x="25" y="130" width="1360" height="164" class="block"/>
<path d="M 25 130 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="33" y="141" class="badge-text">opt</text>
<text x="87" y="141" class="guard">[audio]</text>
<line x1="350" y1="368" x2="808" y2="368" class="edge" marker-end="url(#arrow)"/>
<rect x="358.5" y="347" width="443.0" height="17" rx="8" class="pill"/>
<text x="580.0" y="355.5" class="edge-label" text-anchor="middle">system prompt (today's date, booking rules) + history + 8 tool schemas</text>
<line x1="810" y1="414" x2="352" y2="414" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="450.0" y="393" width="260.0" height="17" rx="8" class="pill"/>
<text x="580.0" y="401.5" class="edge-label" text-anchor="middle">tool calls, e.g. check_availability(...)</text>
<rect x="364" y="430" width="560" height="38" rx="4" class="note"/>
<text x="374" y="445" class="edge-label note-text">book_table: runs only for details check_availability offered in an earlier turn (code),</text>
<text x="374" y="460" class="edge-label note-text">then only if the calibrated booking gate agrees that the guest said yes</text>
<line x1="350" y1="510" x2="808" y2="510" class="edge" marker-end="url(#arrow)"/>
<rect x="326.1" y="489" width="505.9" height="17" rx="8" class="pill"/>
<text x="579.0" y="497.5" class="edge-label" text-anchor="middle">booking gate: 2 one-letter questions in parallel (agrees? aimed at the system?)</text>
<line x1="810" y1="556" x2="352" y2="556" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="300.6" y="535" width="560.8" height="17" rx="8" class="pill"/>
<text x="581.0" y="543.5" class="edge-label" text-anchor="middle">log-probabilities → calibrated p · ≥ 0.95, no flag → book · else ask again / do not book</text>
<line x1="350" y1="610" x2="1038" y2="610" class="edge" marker-end="url(#arrow)"/>
<rect x="427.8" y="589" width="534.5" height="17" rx="8" class="pill"/>
<text x="695.0" y="597.5" class="edge-label" text-anchor="middle">validate + run: opening hours, past dates, 2-hour sittings, capacity, BEGIN IMMEDIATE</text>
<line x1="1040" y1="656" x2="352" y2="656" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="491.8" y="635" width="406.4" height="17" rx="8" class="pill"/>
<text x="695.0" y="643.5" class="edge-label" text-anchor="middle">JSON: success | unavailable + alternatives | error (what to fix)</text>
<rect x="25" y="312" width="1360" height="368" class="block"/>
<path d="M 25 312 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="33" y="323" class="badge-text">loop</text>
<text x="87" y="323" class="guard">[up to 6 tool rounds (on a copy of the session history)]</text>
<line x1="810" y1="728" x2="352" y2="728" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="349.4" y="707" width="461.3" height="17" rx="8" class="pill"/>
<text x="580.0" y="715.5" class="edge-label" text-anchor="middle">final reply in the guest's language (books only after the guest confirms)</text>
<line x1="350" y1="774" x2="122" y2="774" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="44.0" y="753" width="382.0" height="17" rx="8" class="pill"/>
<text x="235.0" y="761.5" class="edge-label" text-anchor="middle">reply + tool calls; history saved only if the turn succeeded</text>
<line x1="120" y1="820" x2="348" y2="820" class="edge" marker-end="url(#arrow)"/>
<rect x="95.8" y="799" width="278.3" height="17" rx="8" class="pill"/>
<text x="235.0" y="807.5" class="edge-label" text-anchor="middle">GET /api/reservations  (staff view: bookings + callback requests)</text>
<line x1="120" y1="892" x2="348" y2="892" class="edge" marker-end="url(#arrow)"/>
<rect x="111.1" y="871" width="247.8" height="17" rx="8" class="pill"/>
<text x="235.0" y="879.5" class="edge-label" text-anchor="middle">POST /api/tts (reply, language, voice)</text>
<line x1="350" y1="938" x2="1268" y2="938" class="edge" marker-end="url(#arrow)"/>
<rect x="597.6" y="917" width="424.7" height="17" rx="8" class="pill"/>
<text x="810.0" y="925.5" class="edge-label" text-anchor="middle">text with reservation codes spelled out (R34LST → R, 3, 4, L, S, T)</text>
<line x1="1270" y1="984" x2="352" y2="984" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="695.2" y="963" width="229.5" height="17" rx="8" class="pill"/>
<text x="810.0" y="971.5" class="edge-label" text-anchor="middle">MP3 (3 attempts, 15 s timeout each)</text>
<line x1="350" y1="1030" x2="122" y2="1030" class="edge dashed" marker-end="url(#arrow)"/>
<rect x="196.5" y="1009" width="77.0" height="17" rx="8" class="pill"/>
<text x="235.0" y="1017.5" class="edge-label" text-anchor="middle">audio/mpeg</text>
<rect x="25" y="836" width="1360" height="218" class="block"/>
<path d="M 25 836 h 52 v 14 l -8 8 h -44 z" class="badge"/>
<text x="33" y="847" class="badge-text">opt</text>
<text x="87" y="847" class="guard">[voice replies on]</text>
</svg>
